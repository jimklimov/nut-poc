name: "Test: persist-credentials access paths"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Check token access paths
      run: |
        echo "=== 1. git extraheader (persist-credentials:false should have removed this) ==="
        RAW=$(git config --local --get http.https://github.com/.extraheader 2>/dev/null || echo "NOT_FOUND")
        echo "extraheader: $RAW"

        echo ""
        echo "=== 2. GITHUB_TOKEN env var (not declared in this step's env block) ==="
        echo "GITHUB_TOKEN env: ${GITHUB_TOKEN:-NOT_IN_ENV}"

        echo ""
        echo "=== 3. All env vars containing 'TOKEN' or 'token' ==="
        env | grep -i token || echo "none found"

        echo ""
        echo "=== 4. All env vars containing 'GITHUB' ==="
        env | grep GITHUB || echo "none found"
