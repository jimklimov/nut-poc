name: "GHA-01-b: Tarballs - Build"

on:
  push:
    branches: [ "master", "FTY", "fightwarn", "FTY-obs" ]
    tags:
      - v*
  pull_request:
    branches: [ "master", "FTY", "fightwarn", "FTY-obs" ]
  schedule:
    - cron: '15 12 * * 0'
  workflow_dispatch:

jobs:
  make-dist-tarballs:
    name: "Make Dist and Docs Tarballs, see workflow page for links"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

    steps:
    # https://github.com/marketplace/actions/substitute-string
    # See also examples in https://github.com/dhimmel/dump-actions-context/
    # Note it warns about "unexpected input(s)" with replacement tokens below,
    # as they are by design not predefined, as far as actions API is concened.
    # They still work for substitutions though.
    - uses: bluwy/substitute-string-action@v3
      id: subst-github-ref-name
      with:
        _input-text: "${{ github.event.pull_request.number > 0 && format('PR-{0}', github.event.pull_request.number) || github.head_ref || github.ref_name }}"
        " ": _
        "/": _

    ######################################################################
    # NOTE: Write and upload this data before running any code provided
    #       by the tested repo fork
    ######################################################################

    - name: Debug PR/branch identification
      run: |
        rm -f .ci.gh-refs*.txt || exit
        ( echo "steps.subst-github-ref-name.outputs.result='${{ steps.subst-github-ref-name.outputs.result }}'" || true
          echo "github.event.pull_request.number='${{ github.event.pull_request.number }}'" || true
          echo "format('PR-{0}', github.event.pull_request.number)='${{ format('PR-{0}', github.event.pull_request.number) }}'" || true
          echo "github.head_ref='${{ github.head_ref }}'" || true
          echo "github.ref='${{ github.ref }}'" || true
          echo "github.ref_name='${{ github.ref_name }}'" || true
          echo "env.GITHUB_REF_TYPE='${{ env.GITHUB_REF_TYPE }}' || true
        ) | tee .ci.gh-refs-debug.txt || exit
        echo "${{ github.event.pull_request.head.sha || github.sha }}" > .ci.gh-refs-subst-github-ref-sha.txt
        echo "${{ steps.subst-github-ref-name.outputs.result }}" > .ci.gh-refs-subst-github-ref-name.txt
        echo "${{ env.GITHUB_REF_TYPE }}" > .ci.gh-refs-subst-github-ref-type.txt
        echo "${{ github.event.pull_request.number }}" > .ci.gh-refs-issue_number.txt

    - name: Upload build identifiers
      uses: actions/upload-artifact@v4
      id: upload_artifact
      with:
        name: ci-refs
        path: |
          .ci.gh-refs*.txt
        compression-level: 0
        overwrite: true

    ######################################################################
    # We likely do not trust anything written/executed by steps below
    # this line. The first few whould be okay unless the PATH is somehow
    # compromised (so `git`, `apt`, etc. are not what we think they are).
    # At least we distrust PRs from non-team members' forks (the other
    # options are PRs from team members, PRs from in-repo branches, and
    # plain repo branch iteration builds after merges/pushes).
    ######################################################################

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        # NOTE: This is the unprivileged part of the GHA-01-tarballs ritual,
        #  running potentially untrusted shell code from the PR source branch.
        #
        # 0 => all commit history for the PR
        fetch-depth: 0
        # We will use UPSTREAM tags below, not ones from forked repo
        fetch-tags: false
        persist-credentials: false

    - name: Fetch tags from upstream
      # FIXME? Make use of github.event.pull_request.head.repo.full_name vs.
      #  github.repository, and github-server-url, to construct PR-target's
      #  URL (if not running a branch build)?
      run: |
        git fetch --tags 'https://github.com/networkupstools/nut' || true

    - name: Try to get more Git metadata
      run: |
        git describe || true

    ######################################################################
    # Do not trust any artifacts built by steps below this line,
    # assume that the scripts, makefiles, etc. may be compromised.
    ######################################################################

    - name: Debug gitlog2version processing
      run: bash -x ./tools/gitlog2version.sh || true

    - name: NUT CI Build Configuration
      env:
        compiler: 'CC=gcc CXX=g++'
      run: |
        PATH="/usr/lib/ccache:$PATH" ; export PATH
        ./autogen.sh && \
        ./configure --enable-warnings ${{env.compiler}} || true

    - name: NUT CI Build to create "dist" tarball and related files
      env:
        compiler: 'CC=gcc CXX=g++'
      run: |
        PATH="/usr/lib/ccache:$PATH" ; export PATH
        make -s -j 8 dist dist-hash || true

    - name: CCache stats after distcheck
      run: ccache -sv || ccache -s || echo "FAILED to read ccache info, oh well"

    ######################################################################
    ### All the distrust in place, publish the inert archive data "as is"
    ######################################################################

    - name: Upload tarball and its checksum artifacts
      uses: actions/upload-artifact@v4
      id: upload_artifact
      with:
        name: NUT-tarballs-${{ steps.subst-github-ref-name.outputs.result }}
        path: |
          nut-*.tar*
        compression-level: 0
        overwrite: true
